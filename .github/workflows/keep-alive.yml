name: Keep Supabase Alive

# Supabase free tier akan otomatis di-pause kalau 7 hari tanpa aktivitas
# database. Workflow ini "mengetuk" database tiap 3 hari sekali supaya
# project TIDAK PERNAH ke-pause, meskipun website sedang sepi pengunjung.
#
# WAJIB diisi dulu sebelum berfungsi: lihat langkah di bagian bawah file ini.

on:
  schedule:
    - cron: "0 3 */3 * *" # tiap 3 hari sekali, jam 03:00 UTC
  workflow_dispatch: # supaya bisa dites manual lewat tab "Actions" di GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping tabel profil (bikin aktivitas database)
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profil?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

# ============================================================
# CARA MENGAKTIFKAN (sekali saja, ~2 menit):
# 1. Buka repo GitHub kamu > Settings > Secrets and variables > Actions
# 2. Klik "New repository secret", buat 2 secret:
#    - Name: SUPABASE_URL      Value: (isi URL Supabase kamu, dari config.js)
#    - Name: SUPABASE_ANON_KEY Value: (isi anon/publishable key kamu)
# 3. Push file ini ke repo (folder .github/workflows/keep-alive.yml)
# 4. Cek tab "Actions" di repo GitHub — workflow "Keep Supabase Alive"
#    akan otomatis jalan tiap 3 hari. Bisa juga klik "Run workflow" di
#    situ buat langsung tes sekali tanpa nunggu jadwal.
# ============================================================